name: F-Droid Build Check

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze (F-Droid requires no errors)
        run: flutter analyze

      - name: Build APK (F-Droid builds unsigned)
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload unsigned APK for testing
        uses: actions/upload-artifact@v4
        with:
          name: josecast-fdroid-apk
          path: build/app/outputs/flutter-apk/app-release.apk
